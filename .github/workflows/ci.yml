name: CI and Pages

# The website only. The Xcode project (web/ios/**) is built by ios.yml, never here:
# changes that touch only the iOS project, the ad or the docs do not run tests,
# rebuild the site or redeploy Pages. (Run this workflow by hand to republish the ad.)
on:
  push:
    branches: [main]
    paths-ignore:
      - 'web/ios/**'
      - 'ad/**'
      - 'docs/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths-ignore:
      - 'web/ios/**'
      - 'ad/**'
      - 'docs/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Tests (shared rule cases)
        working-directory: web
        run: npm test
      - name: Typecheck and build
        working-directory: web
        env:
          BASE: /${{ github.event.repository.name }}/
        run: |
          npm run models
          npm run build
      - name: Keep a single-page fallback for deep links
        run: cp web/dist/index.html web/dist/404.html
      - name: Add the ad page at /ad/
        run: |
          mkdir -p web/dist/ad
          cp ad/index.html ad/crew-mirror-ad.mp4 web/dist/ad/
          for d in vendor textures clips shots img data; do cp -R "ad/$d" web/dist/ad/; done
      - name: Check the site has no Xcode project in it
        run: |
          if find web/dist \( -name '*.xcodeproj' -o -name '*.xcworkspace' -o -name 'Package.swift' -o -path 'web/dist/ios' -o -path 'web/dist/ad/capture' \) | grep .; then
            echo "::error::Pages artifact must contain only the built website (web/dist) and the ad"; exit 1
          fi
          du -sh web/dist web/dist/ad
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/requirements.txt
      - run: pip install -r server/requirements.txt
      - name: Tests (same shared rule cases as the web app)
        working-directory: server
        run: python -m pytest -q

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [web, server]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
